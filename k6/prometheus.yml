# Isolated Prometheus for the BRProperty vLLM load test (Option B).
# Separate from the VisionGuardAI stack: this one lives in k6/ and is mapped
# to host port 9091 (container still listens on 9090). It does two jobs:
#   1. Scrapes the GPU laptop's vLLM /metrics over the LAN (no GPU-side changes).
#   2. Receives k6 remote-write metrics (needs --web.enable-remote-write-receiver,
#      set in docker-compose.yml).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ['10.30.141.214:8000']
        labels:
          instance: gpu-laptop
          service: vllm